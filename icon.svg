
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Arka Plan Gradients -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Pürüzsüz Arka Plan -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Dış Parlama Halkası -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.15" />

  <!-- Cüzdan İllüstrasyonu -->
  <g transform="translate(128, 128)" filter="url(#glow)">
    <!-- Cüzdan Gövdesi -->
    <rect x="16" y="48" width="224" height="160" rx="32" fill="url(#walletGrad)" />
    
    <!-- Cüzdan Katlama Bölmesi -->
    <path d="M 16,80 L 240,80" stroke="#047857" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 15" opacity="0.3" />
    
    <!-- Kart / Para Giriş Yuvası (Üst arka kapak gölgesi) -->
    <path d="M 32,48 C 32,32 224,32 224,48" fill="none" stroke="#0f172a" stroke-width="8" opacity="0.4" />
    
    <!-- Ön Kilit Tokası -->
    <rect x="160" y="104" width="80" height="48" rx="16" fill="#0f172a" />
    
    <!-- Toka İçi Altın Detayı (Yıldız / Para Simgesi) -->
    <circle cx="200" cy="128" r="10" fill="#fbbf24" />
    
    <!-- Yukarı Bakan Yatırım Oku (Gelişimi Simgeler) -->
    <path d="M 64,152 L 112,104 M 112,104 L 80,104 M 112,104 L 112,136" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

